name: Inkasso interface checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.1,<3" "plotly>=5.20,<7" "streamlit>=1.37,<2" "pytest>=8,<10"
      - name: Check Python source syntax
        run: python -m compileall -q app.py inkasso tests
      - name: Run portfolio, interaction, and presentation tests
        run: pytest -q
